        </div>
        <div class="map-legend"><span><i class="legend-dot"></i> Поселения</span><span><i class="legend-dot fleet"></i> Флоты</span><span><i class="legend-dot warn"></i> Дурная слава 6+</span><span>Координаты сохраняются, масштаб — только для просмотра</span></div>
      </section>`;
    }

    // Expansion state is presentation-only and is never written to the cult JSON.
    let mapInspectorExpandedFleetId = '';
    function rememberInspectorFleetShips(fleetId, isOpen) {
      if (isOpen) mapInspectorExpandedFleetId = fleetId;
      else if (mapInspectorExpandedFleetId === fleetId) mapInspectorExpandedFleetId = '';
    }

    function renderMapInspector() {
      const selectedFleet=byId('fleets',selectedMapFleetId);
      if (selectedFleet) {
        const fleetShips=shipsInFleet(selectedFleet.id);
        const fleetCaptain=byId('leaders',selectedFleet.captainId);
        const crew=fleetShips.reduce((acc,ship)=>acc+shipFollowers(ship),0);
        const location=byId('locations',selectedFleet.locationId);
        return `<section class="panel map-inspector">${artBanner(selectedFleet,'fleets','inspector-art')}<div><div class="intel-kicker">Морское донесение · флот</div>
          <div class="intel-name">⛵ ${escapeHtml(selectedFleet.name)}</div>
          <div class="intel-type">${escapeHtml(selectedFleet.status)} · ${escapeHtml(location?.name||'В открытом море')}</div>
          <div class="intel-facts" style="margin-top:16px"><div><small>Корабли</small><b>${fleetShips.length}</b></div><div><small>Экипаж</small><b>${crew}</b></div></div>
          <div class="intel-metric"><span>Капитан</span><strong>${escapeHtml(fleetCaptain?.name||'Не назначен')}</strong></div>
          <div class="intel-metric"><span>Текущая миссия</span><strong>${escapeHtml(nameOf('missions',selectedFleet.currentMissionId,'—'))}</strong></div></div>
          <div class="map-help">${escapeHtml(selectedFleet.playerNotes||'Флот на службе Детей глубины.')}</div>
          <details class="fleet-ships inspector-fleet-ships" ${mapInspectorExpandedFleetId === selectedFleet.id ? 'open' : ''} ontoggle="rememberInspectorFleetShips('${selectedFleet.id}', this.open)">
            <summary>Корабли флота: ${fleetShips.length} · Экипаж: ${crew}</summary>
            <div class="list" style="margin-top:10px;">${fleetShips.map(renderShipMini).join('') || '<div class="empty">Во флоте нет кораблей.</div>'}</div>
          </details>
          <div class="actions" style="margin-top:auto"><button class="small" onclick="prefillMission('fleet','${selectedFleet.id}')">Отдать приказ</button><button class="small ghost" onclick="openFleetForm('${selectedFleet.id}')">Открыть флот</button></div>
        </section>`;
      }
      const loc=byId('locations',selectedMapLocationId)||app.locations[0];
      if (!loc) return `<section class="panel map-inspector"><div class="intel-kicker">Морская разведка</div><div class="intel-name">Неизведанные воды</div><p class="map-help">На карте пока нет владений культа. ${isDM() ? 'Нажми «Поставить поселение», чтобы добавить первое.' : 'Когда появится первое поселение, оно будет отмечено на карте.'}</p></section>`;
      const availableLocalLeaders = leadersForLocation(loc.id)
        .filter(leader => leaderCanTakeMission(leader) && !hasBusyMissionForLeader(leader.id));
      const total=totalFollowers(loc),tier=locationTier(loc);
      const start=[0,100,300,600,1000][tier-1],end=[100,300,600,1000,1000][tier-1];
      const pct=tier===5?100:clamp(Math.round((total-start)/Math.max(1,end-start)*100),0,100);
      return `<section class="panel map-inspector">${artBanner(loc,'locations','inspector-art')}<div><div class="intel-kicker">Донесение с места · тир ${tier}</div>
        <div class="intel-name">${escapeHtml(loc.name)}</div><div class="intel-type">${escapeHtml(loc.type)} · ${escapeHtml(loc.status)}</div>
        <div class="intel-metric"><span>Развитие ячейки</span><strong>${tier===5?'Максимальный тир':`${Math.max(0,end-total)} до тира ${tier+1}`}</strong></div>
        <div class="meter"><span style="width:${pct}%"></span></div>
        <div class="intel-metric"><span>Дурная слава</span><strong>${loc.infamy}/10</strong></div><div class="meter danger"><span style="width:${clamp(loc.infamy*10,0,100)}%"></span></div>
        <div class="intel-facts"><div><small>Последователи</small><b>${total}</b></div><div><small>Главари</small><b>${leadersForLocation(loc.id).length} / ${leaderCapacity(loc)}</b></div></div></div>
        <div class="map-help">${escapeHtml(loc.playerNotes||loc.infrastructure||'Точка влияния Детей глубины.')}</div>
        <section class="inspector-local-leaders" aria-label="Свободные главари поселения">
          <div class="inspector-local-leaders-head"><span>Свободные главари</span><small>${availableLocalLeaders.length} доступны</small></div>
          <div class="inspector-local-leader-list">
            ${availableLocalLeaders.length ? availableLocalLeaders.map(leader => `
              <div class="inspector-local-leader">
                ${artBanner(leader,'leaders','mini-art')}
                <div class="inspector-local-leader-details">
                  <div class="inspector-local-leader-name">${escapeHtml(leader.name)}</div>
                  <div class="inspector-local-leader-role">${escapeHtml(leader.type)}</div>
                </div>
                <button type="button" class="small inspector-mission-btn" onclick="prefillMission('location','${loc.id}','${leader.id}')">Миссия</button>
              </div>`).join('') : '<div class="inspector-local-leaders-empty">Здесь нет свободных главарей, которым можно поручить миссию.</div>'}
          </div>
        </section>
        <div class="actions" style="margin-top:auto"><button class="small" onclick="prefillMission('location','${loc.id}')">Отдать приказ</button><button class="small ghost" onclick="openLocationForm('${loc.id}')">Открыть поселение</button></div>
      </section>`;
    }

    function toggleMapPlacement() {
      if (!isDM()) return;
      mapPlacementMode=!mapPlacementMode;
      render();
      if(mapPlacementMode)toast('Нажми на карте, чтобы добавить поселение.');
    }

    function mapBackgroundClick(event) {
      if (suppressMapClick || !mapPlacementMode || !isDM() || event.target.closest('.map-pin')) return;
      const stage=document.getElementById('mapStage');
      if (!stage) return;
      const rect=stage.getBoundingClientRect();
      const x=clamp(Math.round((event.clientX-rect.left)/rect.width*100),2,98);
      const y=clamp(Math.round((event.clientY-rect.top)/rect.height*100),2,98);
      pendingMapPosition={x,y};
      mapPlacementMode=false;
      openLocationForm();
    }

    function refreshMapSelection() {
      const locationId = byId('locations', selectedMapLocationId)?.id || app.locations[0]?.id || '';
      document.querySelectorAll('.sea-map .location-pin').forEach(pin => {
        pin.classList.toggle('selected', !selectedMapFleetId && pin.dataset.mapId === locationId);
      });
      document.querySelectorAll('.sea-map .fleet-pin').forEach(pin => {
        pin.classList.toggle('selected', pin.dataset.fleetId === selectedMapFleetId);
      });
      const inspector = document.querySelector('.map-layout .map-inspector');
      if (inspector) inspector.outerHTML = renderMapInspector();
    }

    function selectMapLocation(event,id) {
      if (mapDrag?.moved) {mapDrag=null;event.preventDefault();return;}
      if (mapPlacementMode) return;
      selectedMapFleetId='';selectedMapLocationId=id;
      refreshMapSelection();
    }

    function selectMapFleet(event,id) {
      if (mapDrag?.moved) {mapDrag=null;event.preventDefault();return;}
      if (mapPlacementMode) return;
      selectedMapFleetId=id;
      refreshMapSelection();
    }

    function mapPinDown(event,id,collection='locations') {
      event.stopPropagation();
      if(!isDM() || mapPlacementMode || event.button!==0) return;
      const pin=event.currentTarget;
      mapDrag={id,collection,x:event.clientX,y:event.clientY,moved:false,pin};
      pin.setPointerCapture(event.pointerId);
      pin.classList.add('dragging');
      pin.addEventListener('pointermove',mapPinMove);
      pin.addEventListener('pointerup',mapPinUp,{once:true});
      pin.addEventListener('pointercancel',mapPinUp,{once:true});
    }

    function mapPinMove(event) {
      if(!mapDrag || mapDrag.pin!==event.currentTarget) return;
      const stage=document.getElementById('mapStage');if(!stage)return;
      if(Math.hypot(event.clientX-mapDrag.x,event.clientY-mapDrag.y)>5)mapDrag.moved=true;
      if(!mapDrag.moved)return;
      const rect=stage.getBoundingClientRect();
      mapDrag.pin.style.left=`${clamp((event.clientX-rect.left)/rect.width*100,2,98)}%`;
      mapDrag.pin.style.top=`${clamp((event.clientY-rect.top)/rect.height*100,2,98)}%`;
    }

    function mapPinUp(event) {
      if(!mapDrag || mapDrag.pin!==event.currentTarget)return;
      const drag=mapDrag;
      drag.pin.removeEventListener('pointermove',mapPinMove);
      drag.pin.classList.remove('dragging');
      if(drag.moved){
        const obj=byId(drag.collection,drag.id);
        if(obj){obj.mapX=Number.parseFloat(drag.pin.style.left);obj.mapY=Number.parseFloat(drag.pin.style.top);saveState(false);}
        if(drag.collection==='fleets')selectedMapFleetId=drag.id;
        else {selectedMapLocationId=drag.id;selectedMapFleetId='';}
        toast(drag.collection==='fleets'?'Положение флота сохранено.':'Положение поселения сохранено.');
        // Keep the original image element mounted; only update inspector/selection.
        refreshMapSelection();
        setTimeout(()=>{if(mapDrag===drag)mapDrag=null;},0);
      }else{mapDrag=null;}
    }

    function renderOverview() {
      const dangerous=app.locations.filter(l=>l.infamy>=6);
      const fleetsAtSea=app.fleets.filter(f=>['В море','На миссии','Возвращается'].includes(f.status));
      const active=activeMissions(), pending=pendingMissions();
      const chronicle=app.chronicle.filter(c=>isDM()||c.visibleToPlayer).slice(-3).reverse();
      return `<div class="game-title"><div><div class="overline">Командный центр · Судовой журнал Айзека</div>
        <h2>Владения Детей глубины</h2><p>Наблюдай за сетью ячеек, отдавай приказы и постепенно расширяй власть культа. Один тик — ${app.cult.daysPerTick} дней.</p></div>
        <span class="mission-counter">◉ ТИК ${app.cult.currentTick} · ${app.fleets.length} флотов · ${app.locations.length} поселений</span></div>
        <div class="command-banner"><div><small>Текущие дела культа</small><b>${active.length ? `${active.length} миссий в исполнении` : 'Море спокойно — ждёт приказов'}</b>
        <p>${pending.length ? `${pending.length} приказов ожидают решения ДМа` : 'Новые приказы можно отправить в любой момент'} · ${totalAllFollowers()} последователей</p></div>
        <button onclick="setTab('missions')">⚑ Отдать новый приказ</button></div>
        <div class="map-layout">${renderSeaMap()}${renderMapInspector()}</div>
        <div class="grid">
          <section class="panel span-8"><div class="panel-head"><div><h2>⚑ Операции культа</h2><p>Миссии идут своим чередом. Открой приказ, чтобы увидеть подробности.</p></div><button class="ghost small" onclick="setTab('missions')">Все приказы</button></div>
          <div class="split"><div><h3>В работе · ${active.length}</h3><div class="list">${active.length?active.map(renderMissionCompact).join(''):empty('Нет выполняемых приказов.')}</div></div>
          <div><h3>Ожидают ДМа · ${pending.length}</h3><div class="list">${pending.length?pending.map(renderMissionCompact).join(''):empty('Все приказы рассмотрены.')}</div></div></div></section>
          <section class="panel span-4"><div class="panel-head"><div><h2>♜ Совет культа</h2><p>Свободные главари</p></div></div><div class="list">${freeLeaders().length?freeLeaders().slice(0,4).map(renderLeaderMini).join(''):empty('Все главари заняты.')}</div>
          <div class="actions"><button class="ghost small" onclick="setTab('leaders')">Совет целиком</button></div></section>
          <section class="panel span-4"><div class="panel-head"><div><h2>⛵ Флоты в море</h2><p>Движение кораблей и отрядов</p></div></div><div class="list">${fleetsAtSea.length?fleetsAtSea.map(renderFleetMini).join(''):empty('Сейчас все флоты свободны или в порту.')}</div><div class="actions"><button class="ghost small" onclick="setTab('fleets')">Реестр кораблей</button></div></section>
          <section class="panel span-4 ${dangerous.length?'danger-zone':''}"><div class="panel-head"><div><h2>⚠ Угрозы влиянию</h2><p>Поселения с дурной славой 6+</p></div></div><div class="list">${dangerous.length?dangerous.map(renderLocationMini).join(''):empty('Высокая дурная слава нигде не обнаружена.')}</div></section>
          <section class="panel span-4"><div class="panel-head"><div><h2>◉ Шёпот Бездны</h2><p>Последние видения Хидр'Када</p></div></div><div class="list">${app.visions.slice(-3).reverse().map(renderVisionMini).join('')||empty('Божество хранит молчание.')}</div><div class="actions"><button class="ghost small" onclick="setTab('visions')">Все видения</button></div></section>
          <section class="panel span-12"><div class="panel-head"><div><h2>≋ Последние события</h2><p>Летопись постепенного возвышения Детей глубины</p></div><button class="ghost small" onclick="setTab('chronicle')">Открыть летопись</button></div>
          <div class="grid">${chronicle.length?chronicle.map(c=>`<div class="span-4">${renderChronicleCard(c)}</div>`).join(''):empty('Пока не было событий.')}</div></section>
        </div>`;
    }

    function renderMissions() {
      const grouped = ['Черновик', 'Ожидает ДМ', 'Активна', 'Задержана', 'Осложнена', 'Готова к завершению', 'Завершена', 'Провалена', 'Отменена'];
      return `
        <div class="grid">
          <section class="panel span-5"><div class="panel-head"><div><h2>Новая миссия</h2><p>Игрок формулирует приказ. ДМ подтверждает длительность и последствия.</p></div></div>${missionForm()}</section>
          <section class="panel span-7"><div class="panel-head"><div><h2>Список миссий</h2><p>Долгие миссии занимают исполнителей на несколько тиков.</p></div></div>${grouped.map(status => {
            const ms = app.missions.filter(m => m.status === status);
            if (!ms.length) return '';

          }).join('') || empty('Миссий пока нет. Создай первый приказ для культа.')}</section>
        </div>
      `;

    function missionForm() {
      return `
        <form id="newMissionForm" onsubmit="createMission(event)">
          <div class="form-grid"><div class="full" data-mission-art-preview>${artBanner({actionType:'Торговый рейс'},'missions','editor-art')}</div>
            <div class="full"><label>Название</label><input name="title" required placeholder="Например: Контрабанда в Серую гавань" /></div>
            <div><label>Источник</label><select name="sourceType" onchange="refreshMissionForm(this.form)"><option value="fleet">Флот</option><option value="location">Локация</option></select></div>
            <div><label>Флот / локация</label><select name="sourceId" onchange="refreshMissionLeaders(this.form)">${entityOptions('fleets', '', null, 'Выбери флот')}</select></div>
            <div><label>Исполнитель</label><select name="leaderId" onchange="refreshMissionSourceFromLeader(this.form)">${entityOptions('leaders', '', l => l.type === 'Капитан флота', 'Выбери главаря')}</select></div>
            <div><label>Тип действия</label><select name="actionType" onchange="applyExpectedOutcome(this.form)">${missionActions['Капитан флота'].map(a => `<option value="${a}">${a}</option>`).join('')}</select></div>
            <div><label>Длительность в тиках</label><input name="duration" type="number" min="1" value="1" required onchange="applyExpectedOutcome(this.form)" /></div>
            <div><label>Статус</label><select name="status"><option>Ожидает ДМ</option><option>Черновик</option></select></div>
            <div class="full"><label>План игрока</label><textarea name="plan" placeholder="Что именно Айзек приказывает сделать? Какие ограничения, цели и осторожности?"></textarea></div>
            <div class="full"><label>Ожидаемый результат</label><div class="form-grid">
              <div><label>Богатство</label><input name="expectedWealth" type="number" value="1" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Благосклонность</label><input name="expectedFavor" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Дурная слава</label><input name="expectedInfamy" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Моряки</label><input name="expectedSailors" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Послушники</label><input name="expectedAcolytes" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Работяги</label><input name="expectedPortfolk" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Головорезы</label><input name="expectedThugs" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
              <div><label>Богачи</label><input name="expectedRich" type="number" value="0" ${isDM() ? '' : 'readonly'} /></div>
            </div></div>
            <div class="full"><label>Заметка для ДМ</label><textarea name="dmPrompt" placeholder="Например: уточнить длительность, возможные риски, кого можно захватить."></textarea></div>
          </div>
          <div class="notice" style="margin-top:12px;">Длительность вручную указывается после согласования с ДМ. ДМ может изменить её при подтверждении.</div>
          <div class="actions"><button type="submit">Создать миссию</button></div>
        </form>
      `;
    }

    function refreshMissionForm(form) {
      const type = form.sourceType.value;
      if (type === 'fleet') {
        form.sourceId.innerHTML = entityOptions('fleets', '', null, 'Выбери флот');
      } else {
        form.sourceId.innerHTML = entityOptions('locations', '', null, 'Выбери локацию');
      }
      refreshMissionLeaders(form);
    }

    function refreshMissionLeaders(form) {
      const type = form.sourceType.value;
      const sourceId = form.sourceId.value;
      if (type === 'fleet') {
        form.leaderId.innerHTML = entityOptions('leaders', '', l => l.type === 'Капитан флота' && (!sourceId || l.assignmentId === sourceId) && leaderCanTakeMission(l) && !hasBusyMissionForLeader(l.id), 'Выбери капитана');
      } else {
        form.leaderId.innerHTML = entityOptions('leaders', '', l => l.type !== 'Капитан флота' && (!sourceId || l.assignmentId === sourceId) && leaderCanTakeMission(l) && !hasBusyMissionForLeader(l.id), 'Выбери главаря');
      }
      refreshMissionActionOptions(form);
      applyExpectedOutcome(form);
    }

    function refreshMissionSourceFromLeader(form) {
      const leader = byId('leaders', form.leaderId.value);
      if (!leader) {
        refreshMissionActionOptions(form);
        return;
      }

      if (leader.type === 'Капитан флота') {
        form.sourceType.value = 'fleet';
        form.sourceId.innerHTML = entityOptions('fleets', leader.assignmentId, f => f.id === leader.assignmentId, 'Выбери флот');
        form.sourceId.value = leader.assignmentId || '';
      } else {
        form.sourceType.value = 'location';
        form.sourceId.innerHTML = entityOptions('locations', leader.assignmentId, l => l.id === leader.assignmentId, 'Выбери локацию');
        form.sourceId.value = leader.assignmentId || '';
      }

      refreshMissionActionOptions(form);
    }

    function refreshMissionActionOptions(form) {
      const leader = byId('leaders', form.leaderId.value);
      const key = leader ? leader.type : form.sourceType.value === 'fleet' ? 'Капитан флота' : 'Глава ячейки';
      form.actionType.innerHTML = missionActions[key].map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
      applyExpectedOutcome(form);
    }


    function createMission(event) {
      event.preventDefault();
      const f = event.target;
      const duration = Math.max(1, Number(f.duration.value || 1));
      const actionType = f.actionType.value;
      const validation = validateMissionBindings(f.sourceType.value, f.sourceId.value, f.leaderId.value, '', f.status.value);
      if (!validation.ok) {
        alert(validation.message);
        return;
      }
      const mission = {
        id: uid('mission'),
        title: f.title.value.trim(),
        sourceType: f.sourceType.value,
        sourceId: f.sourceId.value,
        leaderId: f.leaderId.value,
        actionType,
        duration,
        remaining: duration,
        status: f.status.value,
        outcome: outcomeFromMissionForm(f),
        plan: f.plan.value.trim(),
        expectedResult: formatOutcome(outcomeFromMissionForm(f)),
        dmPrompt: f.dmPrompt.value.trim(),
        reports: [],
        finalReport: '',
        consequences: '',
        resourceChanges: '',
        losses: '',
        startTick: null,
        endTick: null
      };
      app.missions.push(mission);
      f.reset();
      saveState(false);
      render();
      toast('Миссия создана.');
    }

    function outcomeFromMissionForm(f) {
      return {
        wealth: Number(f.expectedWealth?.value || 0),
        favor: Number(f.expectedFavor?.value || 0),
        infamy: Number(f.expectedInfamy?.value || 0),
        sailors: Number(f.expectedSailors?.value || 0),
        acolytes: Number(f.expectedAcolytes?.value || 0),
        portfolk: Number(f.expectedPortfolk?.value || 0),
        thugs: Number(f.expectedThugs?.value || 0),
        rich: Number(f.expectedRich?.value || 0)
      };
    }

    function applyExpectedOutcome(form) {
      if (!form || !form.actionType) return;
      const preview=form.querySelector('[data-mission-art-preview]');
      if(preview)preview.innerHTML=artBanner({actionType:form.actionType.value},'missions','editor-art');
      const out = defaultOutcome(form.actionType.value, form.duration ? form.duration.value : 1);
      if (form.expectedWealth) form.expectedWealth.value = out.wealth;
      if (form.expectedFavor) form.expectedFavor.value = out.favor;
      if (form.expectedInfamy) form.expectedInfamy.value = out.infamy;
      if (form.expectedSailors) form.expectedSailors.value = out.sailors;
      if (form.expectedAcolytes) form.expectedAcolytes.value = out.acolytes;
      if (form.expectedPortfolk) form.expectedPortfolk.value = out.portfolk;
      if (form.expectedThugs) form.expectedThugs.value = out.thugs;
      if (form.expectedRich) form.expectedRich.value = out.rich;
    }

    function renderMissionCompact(m) {
      const leader = byId('leaders', m.leaderId);
      const sourceName = m.sourceType === 'fleet' ? nameOf('fleets', m.sourceId) : nameOf('locations', m.sourceId);
      const pct = m.duration > 0 ? Math.max(0, Math.min(100, ((m.duration - m.remaining) / m.duration) * 100)) : 0;
      const lastReport = m.reports?.length ? m.reports[m.reports.length - 1].text : '';
      return `
        <details class="mission-compact">
          <summary>
            <span class="mission-compact-title">${escapeHtml(m.title)}</span>
            <span class="mission-compact-meta">${escapeHtml(m.actionType)} • ${escapeHtml(leader?.name || 'Без исполнителя')} • осталось ${m.remaining}</span>
            ${statusChip(m.status)}
          </summary>
          <div class="mission-compact-body">
            <div class="item-sub">${escapeHtml(sourceName)} • длительность ${m.duration} • тик начала: ${m.startTick ?? '—'}</div>
            <div class="clock"><span style="width:${pct}%"></span></div>
            ${m.outcome ? `<p class="item-sub"><strong>Ожидаемый результат:</strong> ${escapeHtml(formatOutcome(m.outcome))}</p>` : ''}
            ${m.plan ? `<p class="item-sub"><strong>План:</strong> ${escapeHtml(m.plan)}</p>` : ''}
            ${lastReport ? `<p class="item-sub"><strong>Последний рапорт:</strong> ${escapeHtml(lastReport)}</p>` : ''}
            <div class="actions"><button class="small ghost" onclick="openMission('${m.id}')">Открыть</button>${m.status === 'Ожидает ДМ' ? `<button class="small danger" onclick="deletePendingMission('${m.id}')">Удалить</button>` : ''}${isDM() ? dmMissionButtons(m) : ''}</div>
          </div>
        </details>
      `;
    }

    function renderMissionCard(m) {
      const leader = byId('leaders', m.leaderId);
      const sourceName = m.sourceType === 'fleet' ? nameOf('fleets', m.sourceId) : nameOf('locations', m.sourceId);
      const pct = m.duration > 0 ? Math.max(0, Math.min(100, ((m.duration - m.remaining) / m.duration) * 100)) : 0;
      const lastReport = m.reports?.length ? m.reports[m.reports.length - 1].text : '';
      return `
        <div class="item mission-board">
          ${artBanner(m,'missions')}
          <div class="item-head"><div><div class="item-title">${escapeHtml(m.title)}</div><div class="item-sub">${escapeHtml(m.actionType)} • ${escapeHtml(sourceName)} • ${escapeHtml(leader?.name || 'Без исполнителя')}</div></div>${statusChip(m.status)}</div>
          <div class="chips"><span class="chip blue">Длительность: ${m.duration}</span><span class="chip ${m.remaining <= 0 ? 'good' : ''}">Осталось: ${m.remaining}</span><span class="chip">Тик начала: ${m.startTick ?? '—'}</span></div>
          <div class="clock"><span style="width:${pct}%"></span></div>
          ${m.plan ? `<p class="item-sub"><strong>План:</strong> ${escapeHtml(m.plan)}</p>` : ''}
          ${m.outcome ? `<p class="item-sub"><strong>Ожидаемый результат:</strong> ${escapeHtml(formatOutcome(m.outcome))}</p>` : ''}
          ${lastReport ? `<p class="item-sub"><strong>Последний рапорт:</strong> ${escapeHtml(lastReport)}</p>` : ''}
          ${m.finalReport ? `<p class="item-sub"><strong>Итог:</strong> ${escapeHtml(m.finalReport)}</p>` : ''}
          <div class="actions"><button class="small ghost" onclick="openMission('${m.id}')">Открыть</button>${m.status === 'Черновик' ? `<button class="small" onclick="sendMissionToDM('${m.id}')">Отправить ДМу</button>` : ''}${m.status === 'Ожидает ДМ' ? `<button class="small danger" onclick="deletePendingMission('${m.id}')">Удалить</button>` : ''}${isDM() ? dmMissionButtons(m) : ''}</div>
        </div>
      `;
    }


    function dmMissionButtons(m) {
      const buttons = [];
      if (m.status === 'Ожидает ДМ') {
        buttons.push(`<button class="small good" onclick="confirmMission('${m.id}')">Подтвердить</button>`);
      }
      if (['Активна','Задержана','Осложнена'].includes(m.status)) {
        buttons.push(`<button class="small" onclick="tickMission('${m.id}', -1)">-1 тик</button>`);
        buttons.push(`<button class="small warn" onclick="setMissionStatus('${m.id}', 'Осложнена')">Осложнить</button>`);
        buttons.push(`<button class="small good" onclick="completeMission('${m.id}', 'Завершена')">Завершить</button>`);
        buttons.push(`<button class="small danger" onclick="completeMission('${m.id}', 'Провалена')">Провалить</button>`);
      }
      if (m.status === 'Готова к завершению') {
        buttons.push(`<button class="small good" onclick="completeMission('${m.id}', 'Завершена')">Подтвердить завершение</button>`);
        buttons.push(`<button class="small danger" onclick="completeMission('${m.id}', 'Провалена')">Провалить</button>`);
      }
      return buttons.join('');
    }

    function statusChip(status) {
      let cls = 'chip';
      if (['Завершена', 'Свободен', 'Активно', 'Активна'].includes(status)) cls += ' good';
      if (['Ожидает ДМ', 'Задержана', 'Осложнена', 'Готова к завершению'].includes(status)) cls += ' warn';
      if (['Провалена', 'Отменена', 'Мёртв', 'В плену', 'Пропал', 'Потерян', 'Затонул', 'Раскрыта', 'Уничтожена'].includes(status)) cls += ' danger';
      return `<span class="${cls}">${escapeHtml(status)}</span>`;
    }

    function sendMissionToDM(id) {
      const m = byId('missions', id);
      if (m) m.status = 'Ожидает ДМ';
      saveState(false);
      render();
    }

    function deletePendingMission(id) {
      const m = byId('missions', id);
      if (!m) return;
      if (m.status !== 'Ожидает ДМ') {
        alert('Удалять можно только миссии, которые ожидают подтверждения ДМ.');
        return;
      }
      if (!confirm(`Удалить миссию «${m.title}»?`)) return;
      app.missions = app.missions.filter(item => item.id !== id);
      saveState(false);
      render();
      toast('Миссия удалена.');
    }

    function confirmMission(id) {
      const m = byId('missions', id);
      if (!m) return;
      const validation = validateMissionBindings(m.sourceType, m.sourceId, m.leaderId, m.id, m.status);
      if (!validation.ok) {
        alert(validation.message);
        return;
      }
      m.status = 'Активна';
      startMission(m);
      addReport(m, 'ДМ подтвердил миссию.');
      saveState(false);
      render();
    }

    function busyMissionStatuses() {
      return ['Ожидает ДМ', 'Активна', 'Задержана', 'Осложнена', 'Готова к завершению'];
    }

    function hasBusyMissionForLeader(leaderId, ignoreMissionId = '') {
      return app.missions.some(m => m.id !== ignoreMissionId && m.leaderId === leaderId && busyMissionStatuses().includes(m.status));
    }

    function hasBusyMissionForFleet(fleetId, ignoreMissionId = '') {
      return app.missions.some(m => m.id !== ignoreMissionId && m.sourceType === 'fleet' && m.sourceId === fleetId && busyMissionStatuses().includes(m.status));
    }

    function validateMissionBindings(sourceType, sourceId, leaderId, ignoreMissionId = '', missionStatus = 'Ожидает ДМ') {
      if (!sourceId) return { ok: false, message: 'Миссию нельзя создать без локации или флота.' };
      if (!leaderId) return { ok: false, message: 'Миссию нельзя создать без главаря.' };

      const leader = byId('leaders', leaderId);
      if (!leader) return { ok: false, message: 'Выбранный главарь не найден.' };
      if (!leader.assignmentId) return { ok: false, message: 'Главарь без локации или флота не может выполнять миссии.' };
      if (!leaderCanTakeMission(leader)) return { ok: false, message: `Главарь со статусом «${leader.status}» не может выполнять миссии.` };

      if (busyMissionStatuses().includes(missionStatus) && hasBusyMissionForLeader(leaderId, ignoreMissionId)) {
        return { ok: false, message: 'Этот главарь уже занят другой незавершённой миссией.' };
      }

      if (sourceType === 'fleet') {
        const fleet = byId('fleets', sourceId);
        if (!fleet) return { ok: false, message: 'Выбранный флот не найден.' };
        if (leader.type !== 'Капитан флота') return { ok: false, message: 'Флотскую миссию может выполнять только капитан флота.' };
        if (leader.assignmentId !== sourceId) return { ok: false, message: 'Капитан может выполнять миссию только для флота, к которому он привязан.' };
        if (busyMissionStatuses().includes(missionStatus) && hasBusyMissionForFleet(sourceId, ignoreMissionId)) {
          return { ok: false, message: 'Этот флот уже занят другой незавершённой миссией.' };
        }
      }

      if (sourceType === 'location') {
        const location = byId('locations', sourceId);
        if (!location) return { ok: false, message: 'Выбранная локация не найдена.' };
        if (leader.type === 'Капитан флота') return { ok: false, message: 'Наземную миссию не может выполнять капитан флота.' };
        if (leader.assignmentId !== sourceId) return { ok: false, message: 'Главарь может выполнять миссию только в локации, к которой он привязан.' };
      }

      return { ok: true, message: '' };
    }

    function setMissionStatus(id, status) {
      const m = byId('missions', id);
      if (!m) return;
      m.status = status;
      addReport(m, `Статус изменён: ${status}.`);
      saveState(false);
      render();
    }

    function tickMission(id, delta) {
      const m = byId('missions', id);
      if (!m) return;
      m.remaining = Math.max(0, Number(m.remaining || 0) + delta);
      if (m.remaining === 0 && !['Завершена','Провалена','Отменена'].includes(m.status)) {
        m.status = 'Готова к завершению';
        addReport(m, 'Срок миссии истёк. ДМ может подтвердить завершение или назначить иной исход.');
      }
      saveState(false);
      render();
    }

    function startMission(m) {
      m.startTick = m.startTick || app.cult.currentTick;
      const leader = byId('leaders', m.leaderId);
      if (leader) {
        leader.status = 'На миссии';
        leader.currentMissionId = m.id;
      }
      if (m.sourceType === 'fleet') {
        const fleet = byId('fleets', m.sourceId);
        if (fleet) {
          fleet.status = 'На миссии';
          fleet.currentMissionId = m.id;
        }
      }
    }

    function releaseMissionActors(m) {
      const leader = byId('leaders', m.leaderId);
      if (leader && leader.currentMissionId === m.id) {
        leader.status = 'Свободен';
        leader.currentMissionId = '';
      }
      if (m.sourceType === 'fleet') {
        const fleet = byId('fleets', m.sourceId);
        if (fleet && fleet.currentMissionId === m.id) {
          fleet.status = 'Свободен';
          fleet.currentMissionId = '';
        }
      }
    }

    function defaultOutcome(action, duration = 1) {
      const d = Math.max(1, Number(duration || 1));
      const outcome = { wealth: 0, favor: 0, infamy: 0, sailors: 0, acolytes: 0, portfolk: 0, thugs: 0, rich: 0 };
      if (action === 'Торговый рейс') outcome.wealth = 1 * d;
      if (action === 'Контрабанда') { outcome.wealth = 2 * d; outcome.infamy = 1 * d; }
      if (action === 'Пиратство') { outcome.wealth = 3 * d; outcome.infamy = 2 * d; }
      if (action === 'Перевозка') outcome.wealth = -1 * d;
      if (action === 'Патруль') outcome.wealth = -1 * d;
      if (action === 'Экспедиция') outcome.wealth = -1 * d;
      if (action === 'Малый ритуал') outcome.favor = 1 * d;
      if (action === 'Жертвоприношение') { outcome.favor = 2 * d; outcome.infamy = 1 * d; }
      if (action === 'Большое жертвоприношение') { outcome.wealth = -1 * d; outcome.favor = 3 * d; outcome.infamy = 2 * d; }
      if (action === 'Вербовка послушников') { outcome.wealth = -1 * d; outcome.favor = -1 * d; outcome.acolytes = 60 * d; }
      if (action === 'Основать ячейку') { outcome.wealth = -2; outcome.acolytes = 10; outcome.portfolk = 30; outcome.thugs = 5; outcome.infamy = 1; }
      if (action === 'Общая вербовка') { outcome.wealth = -1 * d; outcome.sailors = 15 * d; outcome.portfolk = 35 * d; outcome.thugs = 10 * d; }
      if (action === 'Тушение слухов') { outcome.wealth = -1 * d; outcome.infamy = -2 * d; }
      if (action === 'Подкуп') { outcome.wealth = -2 * d; outcome.infamy = -3 * d; }
      if (action === 'Саботаж') { outcome.wealth = 0; outcome.infamy = 1 * d; }
      if (action === 'Инфильтрация') { outcome.wealth = 1 * d; outcome.rich = 2 * d; }
      if (action === 'Захват жертвы') outcome.infamy = 1 * d;
      return outcome;
    }

    function normalizeOutcome(m) {
      if (!m.outcome) m.outcome = defaultOutcome(m.actionType, m.duration);
      return m.outcome;
    }

    function addMissionToChronicle(m) {
      const leaderName = nameOf('leaders', m.leaderId);
      const sourceName = m.sourceType === 'fleet' ? nameOf('fleets', m.sourceId) : nameOf('locations', m.sourceId);
      const statusText = m.status === 'Завершена' ? 'завершена' : m.status === 'Провалена' ? 'провалена' : 'отменена';
      const parts = [`Миссия «${m.title}» ${statusText}.`, `Действие: ${m.actionType}.`, `Исполнитель: ${leaderName}.`, `Источник: ${sourceName}.`];
      if (m.outcome) parts.push(`Ожидаемый результат: ${formatOutcome(m.outcome)}`);
      if (m.finalReport) parts.push(`Рапорт: ${m.finalReport}`);
      if (m.consequences) parts.push(`Последствия: ${m.consequences}`);
      if (m.resourceChanges) parts.push(`Изменения ресурсов: ${m.resourceChanges}`);
      if (m.losses) parts.push(`Потери: ${m.losses}`);
      app.chronicle.push({ id: uid('chron'), tick: app.cult.currentTick, title: `Миссия: ${m.title}`, type: 'Миссия', text: parts.join('\n'), related: m.id, visibleToPlayer: true });
    }

    function completeMission(id, status) {
      openMissionCompletion(id, status);
    }

    function openMissionCompletion(id, status) {
      const m = byId('missions', id);
      if (!m) return;
      const out = normalizeOutcome(m);
      const targetLocationId = missionTargetLocationId(m);
      const targetLocationName = targetLocationId ? nameOf('locations', targetLocationId) : 'нет связанной локации';
      openModal(status === 'Завершена' ? 'Завершение миссии' : 'Провал миссии', `
        <form onsubmit="applyMissionCompletion(event, '${id}', '${status}')">
          <div class="notice">Поля уже заполнены примерным исходом по типу миссии. ДМ может поправить любые числа перед подтверждением. Изменения последователей и дурной славы применятся к локации: <strong>${escapeHtml(targetLocationName)}</strong>.</div>
          <div class="form-grid">
            <div class="full"><label>Итоговый рапорт</label><textarea name="finalReport" placeholder="Что произошло по итогам миссии?">${escapeHtml(m.finalReport || '')}</textarea></div>
            <div><label>Богатство</label><input name="wealth" type="number" value="${out.wealth || 0}" /></div>
            <div><label>Благосклонность</label><input name="favor" type="number" value="${out.favor || 0}" /></div>
            <div><label>Дурная слава</label><input name="infamy" type="number" value="${out.infamy || 0}" /></div>
            <div><label>Моряки</label><input name="sailors" type="number" value="${out.sailors || 0}" /></div>
            <div><label>Послушники</label><input name="acolytes" type="number" value="${out.acolytes || 0}" /></div>
            <div><label>Работяги</label><input name="portfolk" type="number" value="${out.portfolk || 0}" /></div>
            <div><label>Головорезы</label><input name="thugs" type="number" value="${out.thugs || 0}" /></div>
            <div><label>Богачи</label><input name="rich" type="number" value="${out.rich || 0}" /></div>
            <div class="full"><label>Последствия</label><textarea name="consequences" placeholder="Новые связи, враги, следы, слухи, находки...">${escapeHtml(m.consequences || '')}</textarea></div>
            <div class="full"><label>Потери</label><textarea name="losses" placeholder="Люди, корабли, груз, репутация...">${escapeHtml(m.losses || '')}</textarea></div>
            ${m.sourceType === 'fleet' ? renderFleetShipOutcomeFields(m.sourceId) : ''}
          </div>
          <div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Отмена</button><button type="submit" class="${status === 'Завершена' ? 'good' : 'danger'}">Подтвердить исход</button></div>
        </form>
      `);
    }

    function renderFleetShipOutcomeFields(fleetId) {
      const ships = shipsInFleet(fleetId);
      if (!ships.length) return '<div class="full"><div class="empty">Во флоте нет кораблей для изменения.</div></div>';
      return `<div class="full"><h3>Корабли флота после миссии</h3><p class="item-sub">ДМ может сразу изменить состояние кораблей и численность команды. Моряки и головорезы на кораблях считаются последователями культа.</p></div>${ships.map(ship => `
        <div class="full item"><div class="item-title">${escapeHtml(ship.name)}</div><div class="form-grid" style="margin-top:10px;">
          <div><label>Состояние</label><select name="ship_${ship.id}_state">${optionList(shipStates, ship.state)}</select></div>
          <div><label>Моряки</label><input name="ship_${ship.id}_sailors" type="number" min="0" value="${ship.sailors || 0}" /></div>
          <div><label>Головорезы</label><input name="ship_${ship.id}_thugs" type="number" min="0" value="${ship.thugs || 0}" /></div>
          <div><label>Груз / добыча</label><input name="ship_${ship.id}_cargo" value="${escapeHtml(ship.cargo || '')}" /></div>
        </div></div>`).join('')}`;
    }

    function applyFleetShipOutcome(form, m) {
      if (m.sourceType !== 'fleet') return;
      shipsInFleet(m.sourceId).forEach(ship => {
        const state = form.elements[`ship_${ship.id}_state`];
        const sailors = form.elements[`ship_${ship.id}_sailors`];
        const thugs = form.elements[`ship_${ship.id}_thugs`];
        const cargo = form.elements[`ship_${ship.id}_cargo`];
        if (state) ship.state = state.value;
        if (sailors) ship.sailors = Number(sailors.value || 0);
        if (thugs) ship.thugs = Number(thugs.value || 0);
        if (cargo) ship.cargo = cargo.value;
      });
    }

    function missionTargetLocationId(m) {
      if (m.sourceType === 'location') return m.sourceId;
      const fleet = byId('fleets', m.sourceId);
      return fleet?.locationId || '';
    }

    function applyMissionCompletion(event, id, status) {
      event.preventDefault();
      const f = event.target;
      const m = byId('missions', id);
      if (!m) return;
      const oldStatus = m.status;
      const out = {
        wealth: Number(f.wealth.value || 0),
        favor: Number(f.favor.value || 0),
        infamy: Number(f.infamy.value || 0),
        sailors: Number(f.sailors.value || 0),
        acolytes: Number(f.acolytes.value || 0),
        portfolk: Number(f.portfolk.value || 0),
        thugs: Number(f.thugs.value || 0),
        rich: Number(f.rich.value || 0)
      };
      m.outcome = out;
      m.status = status;
      m.remaining = 0;
      m.endTick = app.cult.currentTick;
      m.finalReport = f.finalReport.value.trim();
      m.consequences = f.consequences.value.trim();
      m.losses = f.losses.value.trim();
      m.resourceChanges = formatOutcome(out);
      app.cult.wealth = clamp(app.cult.wealth + out.wealth, 1, 100);
      app.cult.favor = clamp(app.cult.favor + out.favor, 0, 20);
      applyFleetShipOutcome(f, m);
      const loc = byId('locations', missionTargetLocationId(m));
      if (loc) {
        loc.infamy = clamp(loc.infamy + out.infamy, 0, 10);
        loc.sailors = Math.max(0, (+loc.sailors || 0) + out.sailors);
        loc.acolytes = Math.max(0, (+loc.acolytes || 0) + out.acolytes);
        loc.portfolk = Math.max(0, (+loc.portfolk || 0) + out.portfolk);
        loc.thugs = Math.max(0, (+loc.thugs || 0) + out.thugs);
        loc.rich = Math.max(0, (+loc.rich || 0) + out.rich);
        loc.tier = locationTier(loc);
      }
      releaseMissionActors(m);
      if (!['Завершена','Провалена','Отменена'].includes(oldStatus)) addMissionToChronicle(m);
      saveState(false);
      closeModal();
      render();
      toast(status === 'Завершена' ? 'Миссия завершена, изменения применены.' : 'Миссия провалена, изменения применены.');
    }

    function formatOutcome(out) {
      const labels = { wealth: 'Богатство', favor: 'Благосклонность', infamy: 'Дурная слава', sailors: 'Моряки', acolytes: 'Послушники', portfolk: 'Работяги', thugs: 'Головорезы', rich: 'Богачи' };
      return Object.entries(out).filter(([, value]) => Number(value) !== 0).map(([key, value]) => `${labels[key]} ${Number(value) > 0 ? '+' : ''}${value}`).join(', ') || 'Без числовых изменений';
    }

    function clamp(value, min, max) { return Math.max(min, Math.min(max, Number(value))); }

    function addReport(m, text) {
      m.reports = m.reports || [];
      m.reports.push({ tick: app.cult.currentTick, text });
    }

      `);

    function saveMissionModal(event, id) {
      event.preventDefault();
      const f = event.target;
      const m = byId('missions', id);
      if (!m) return;
      const oldStatus = m.status;
      m.title = f.title.value;
      m.duration = Number(f.duration.value || 1);
      m.plan = f.plan ? f.plan.value : '';
      if (isDM() && !['Завершена','Провалена','Отменена'].includes(m.status)) {
        m.outcome = defaultOutcome(m.actionType, m.duration);
      }
      m.expectedResult = formatOutcome(normalizeOutcome(m));
      m.dmPrompt = f.dmPrompt ? f.dmPrompt.value : '';
      if (isDM()) {
        m.status = f.status.value;
        m.remaining = Number(f.remaining.value || 0);
        m.finalReport = f.finalReport ? f.finalReport.value : '';
        m.consequences = f.consequences ? f.consequences.value : '';
        m.resourceChanges = f.resourceChanges ? f.resourceChanges.value : '';
        m.losses = f.losses ? f.losses.value : '';
        m.reports = parseReports(f.reportsText ? f.reportsText.value : '');
        if (['Завершена','Провалена','Отменена'].includes(m.status)) {
          m.endTick = app.cult.currentTick;
          releaseMissionActors(m);
          if (!['Завершена','Провалена','Отменена'].includes(oldStatus)) addMissionToChronicle(m);
        } else if (m.status === 'Активна' && oldStatus !== 'Активна') {
          startMission(m);
        }
      }
      saveState(false);
      closeModal();
      render();
      toast('Миссия сохранена.');
    }

    function parseReports(text) {
      return text.split('\n').filter(Boolean).map(line => {
        const clean = line.trim();
        if (clean.startsWith('Тик ') && clean.includes(':')) {
          const colonIndex = clean.indexOf(':');
          const tickPart = clean.slice(4, colonIndex).trim();
          const textPart = clean.slice(colonIndex + 1).trim();
          return { tick: Number(tickPart) || app.cult.currentTick, text: textPart };
        }
        return { tick: app.cult.currentTick, text: clean };
      });
    }

    function addQuickReport(id) {
      const text = prompt('Рапорт ДМ:');
      if (!text) return;
      const m = byId('missions', id);
      if (!m) return;
      addReport(m, text);
      saveState(false);
      openMission(id);
    }

    }

    function renderLeaderCard(l) {
      const glyph = l.type === 'Капитан флота' ? '⛵' : l.type === 'Старший жрец' ? '◉' : '♜';
      return `<div class="item leader-card">
        <div class="leader-art-shell">${artBanner(l,'leaders')}</div>
        <div class="leader-card-top">
          <span class="leader-medallion">${glyph}</span>
          <div class="leader-card-identity"><div class="item-title">${escapeHtml(l.name)}</div>
          <div class="item-sub">${escapeHtml(l.type)} · ${escapeHtml(assignmentName(l))}</div></div>
          <div class="leader-card-status">${statusChip(l.status)}</div>
        </div>
        <div class="chips"><span class="chip">Миссия: ${escapeHtml(nameOf('missions',l.currentMissionId,'—'))}</span></div>
        ${l.description ? `<p class="item-sub">${escapeHtml(l.description)}</p>` : ''}
        ${isDM() && l.dmNotes ? `<p class="item-sub"><strong>Скрыто ДМ:</strong> ${escapeHtml(l.dmNotes)}</p>` : ''}
        <div class="actions"><button class="small ghost" onclick="openLeaderForm('${l.id}')">Редактировать</button><button class="small" onclick="prefillMission('', '', '${l.id}')">Миссия</button><button class="small danger" onclick="deleteEntity('leaders','${l.id}')">Удалить</button></div>
      </div>`;
    }

    function renderLeaderMini(l) { return `<div class="item"><div class="item-title">${escapeHtml(l.name)}</div><div class="item-sub">${escapeHtml(l.type)} • ${escapeHtml(assignmentName(l))}</div><div class="actions"><button class="small" onclick="prefillMission('', '', '${l.id}')">Миссия</button></div></div>`; }
    function assignmentName(l) { return l.type === 'Капитан флота' ? nameOf('fleets', l.assignmentId, 'Резерв') : nameOf('locations', l.assignmentId, 'Без локации'); }

    function openLeaderForm(id = '') {
      const l = id ? byId('leaders', id) : { name:'', type:'Капитан флота', assignmentId:'', status:'Свободен', currentMissionId:'', description:'', playerNotes:'', dmNotes:'' };
      const assignmentOpts = l.type === 'Капитан флота' ? entityOptions('fleets', l.assignmentId, null, 'Резерв') : entityOptions('locations', l.assignmentId, null, 'Без локации');
      openModal(id ? 'Редактировать главаря' : 'Добавить главаря', `<form onsubmit="saveLeader(event, '${id}')"><div class="form-grid">${sharedArtNotice(l,'leaders')}<div class="full"><label>Имя</label><input name="name" required value="${escapeHtml(l.name)}" /></div><div><label>Тип</label><select name="type" onchange="refreshLeaderAssignment(this.form);previewSharedArt(this.form,'leaders')">${optionList(leaderTypes, l.type)}</select></div><div><label>Привязка</label><select name="assignmentId">${assignmentOpts}</select></div><div><label>Статус</label><select name="status" ${isDM() ? '' : 'disabled'}>${optionList(leaderStatuses, l.status)}</select></div><div class="full"><label>Описание</label><textarea name="description">${escapeHtml(l.description)}</textarea></div><div class="full"><label>Заметки игрока</label><textarea name="playerNotes">${escapeHtml(l.playerNotes)}</textarea></div>${isDM() ? `<div class="full"><label>Скрытые заметки ДМ</label><textarea name="dmNotes">${escapeHtml(l.dmNotes)}</textarea></div>` : ''}</div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
      // Иллюстрация берётся из общей библиотеки выбранной роли.
    }

    function refreshLeaderAssignment(form) {
      form.assignmentId.innerHTML = form.type.value === 'Капитан флота' ? entityOptions('fleets', '', null, 'Резерв') : entityOptions('locations', '', null, 'Без локации');
    }

    function saveLeader(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('leaders', id) : { id: uid('leader'), currentMissionId: '' };
      obj.name = f.name.value;
      obj.type = f.type.value;
      obj.assignmentId = f.assignmentId.value;
      obj.description = f.description.value;
      obj.playerNotes = f.playerNotes.value;
      if (isDM()) { obj.status = f.status.value; obj.dmNotes = f.dmNotes?.value || ''; } else { obj.status = obj.status || 'Свободен'; }
      if (!id) app.leaders.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderVisions() {
      return `<div class="grid"><section class="panel span-8"><div class="panel-head"><div><h2>Видения Хидр'Када</h2><p>Сны, знамения, приказы и угрозы Подводного бога.</p></div>${isDM() ? `<button onclick="openVisionForm()">Создать видение</button>` : ''}</div><div class="list">${app.visions.length ? app.visions.map(renderVisionCard).join('') : empty('Хидр\'Кад пока молчит.')}</div></section><section class="panel span-4"><div class="panel-head"><div><h2>Заметка</h2></div></div><div class="notice">Видения нужны, чтобы культ не превращался в бухгалтерию. Через них ДМ может задавать мистические цели, цену силы и давление бога.</div></section></div>`;
    }

    function renderVisionCard(v) {
      return `<div class="item vision-art">${artBanner(v,'visions')}<div class="item-head"><div><div class="item-title">◉ ${escapeHtml(v.title)}</div><div class="item-sub">${escapeHtml(v.type)} • Тик ${v.tick}</div></div>${statusChip(v.status)}</div><p class="item-sub">${escapeHtml(v.text)}</p>${v.reward ? `<p class="item-sub"><strong>Награда / последствия:</strong> ${escapeHtml(v.reward)}</p>` : ''}${isDM() && v.dmNotes ? `<p class="item-sub"><strong>Скрытый смысл:</strong> ${escapeHtml(v.dmNotes)}</p>` : ''}<div class="actions"><button class="small ghost" onclick="openVisionForm('${v.id}')">Редактировать</button>${isDM() ? `<button class="small danger" onclick="deleteEntity('visions','${v.id}')">Удалить</button>` : ''}</div></div>`;
    }

    function renderVisionMini(v) { return `<div class="item"><div class="item-title">${escapeHtml(v.title)}</div><div class="item-sub">${escapeHtml(v.type)} • ${escapeHtml(v.status)}</div></div>`; }

    function openVisionForm(id = '') {
      if (!isDM() && !id) return;
      const v = id ? byId('visions', id) : { title:'', type:'Видение', tick:app.cult.currentTick, text:'', status:'Активно', missionId:'', reward:'', playerNotes:'', dmNotes:'' };
      openModal(id ? 'Редактировать видение' : 'Создать видение', `<form onsubmit="saveVision(event, '${id}')"><div class="form-grid">${artEditor(v,'visions')}<div class="full"><label>Название</label><input name="title" required value="${escapeHtml(v.title)}" ${isDM() ? '' : 'readonly'} /></div><div><label>Тип</label><select name="type" ${isDM() ? '' : 'disabled'}>${optionList(visionTypes, v.type)}</select></div><div><label>Статус</label><select name="status" ${isDM() ? '' : 'disabled'}>${optionList(visionStatuses, v.status)}</select></div><div><label>Тик</label><input name="tick" type="number" value="${v.tick}" ${isDM() ? '' : 'readonly'} /></div><div><label>Связанная миссия</label><select name="missionId" ${isDM() ? '' : 'disabled'}>${entityOptions('missions', v.missionId, null, 'Без миссии')}</select></div><div class="full"><label>Текст</label><textarea name="text" ${isDM() ? '' : 'readonly'}>${escapeHtml(v.text)}</textarea></div><div class="full"><label>Награда / последствия</label><textarea name="reward" ${isDM() ? '' : 'readonly'}>${escapeHtml(v.reward)}</textarea></div><div class="full"><label>Заметки игрока</label><textarea name="playerNotes">${escapeHtml(v.playerNotes)}</textarea></div>${isDM() ? `<div class="full"><label>Скрытые заметки ДМ</label><textarea name="dmNotes">${escapeHtml(v.dmNotes)}</textarea></div>` : ''}</div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
      initEntityArtForm(v,'visions');
    }

    function saveVision(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('visions', id) : { id: uid('vision') };
      if (isDM()) { obj.title = f.title.value; obj.type = f.type.value; obj.status = f.status.value; obj.tick = Number(f.tick.value); obj.missionId = f.missionId.value; obj.text = f.text.value; obj.reward = f.reward.value; obj.dmNotes = f.dmNotes?.value || ''; }
      obj.playerNotes = f.playerNotes.value;
      saveEntityArt(f,obj);
      if (!id) app.visions.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderChronicle() {
      const visible = app.chronicle.filter(c => isDM() || c.visibleToPlayer);
      const ticks = [...new Set(visible.map(c => c.tick))].sort((a,b) => b-a);
      return `<div class="panel"><div class="panel-head"><div><h2>Хроника</h2><p>История развития культа по тикам.</p></div>${isDM() ? `<button onclick="openChronicleForm()">Создать запись</button>` : ''}</div>${ticks.map(t => `<h3>Тик ${t}</h3><div class="list chronicle-timeline" style="margin-bottom:23px;">${visible.filter(c => c.tick === t).map(renderChronicleCard).join('')}</div>`).join('') || empty('Хроника пока пуста.')}</div>`;
    }

    function renderChronicleCard(c) {
      return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(c.title)}</div><div class="item-sub">${escapeHtml(c.type)} • Тик ${c.tick}</div></div>${isDM() ? `<span class="chip ${c.visibleToPlayer ? 'good' : 'warn'}">${c.visibleToPlayer ? 'Видно игроку' : 'Скрыто'}</span>` : ''}</div><p class="item-sub">${escapeHtml(c.text)}</p><div class="actions">${isDM() ? `<button class="small ghost" onclick="openChronicleForm('${c.id}')">Редактировать</button><button class="small danger" onclick="deleteEntity('chronicle','${c.id}')">Удалить</button>` : ''}</div></div>`;
    }

    function openChronicleForm(id = '') {
      if (!isDM()) return;
      const c = id ? byId('chronicle', id) : { tick: app.cult.currentTick, title:'', type:'Событие', text:'', related:'', visibleToPlayer:true };
      openModal(id ? 'Редактировать хронику' : 'Создать запись хроники', `<form onsubmit="saveChronicle(event, '${id}')"><div class="form-grid"><div><label>Тик</label><input name="tick" type="number" value="${c.tick}" /></div><div><label>Тип</label><select name="type">${optionList(chronicleTypes, c.type)}</select></div><div class="full"><label>Заголовок</label><input name="title" required value="${escapeHtml(c.title)}" /></div><div class="full"><label>Текст</label><textarea name="text">${escapeHtml(c.text)}</textarea></div><div><label>Видно игроку</label><select name="visibleToPlayer"><option value="true" ${c.visibleToPlayer ? 'selected' : ''}>Да</option><option value="false" ${!c.visibleToPlayer ? 'selected' : ''}>Нет</option></select></div></div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
    }

    function saveChronicle(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('chronicle', id) : { id: uid('chron') };
      obj.tick = Number(f.tick.value);
      obj.type = f.type.value;
      obj.title = f.title.value;
      obj.text = f.text.value;
      obj.visibleToPlayer = f.visibleToPlayer.value === 'true';
      if (!id) app.chronicle.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderDM() {
      return `<div class="grid"><section class="panel span-4"><div class="panel-head"><div><h2>Ресурсы</h2><p>Быстрая правка чисел.</p></div></div>${dmResourceForm()}</section><section class="panel span-8"><div class="panel-head"><div><h2>Очередь ДМ</h2><p>Приказы на подтверждение и активные миссии.</p></div></div><h3>Ожидают подтверждения</h3><div class="list">${pendingMissions().map(renderMissionCard).join('') || empty('Нет миссий на подтверждение.')}</div><h3 style="margin-top:16px;">Активные</h3><div class="list">${activeMissions().map(renderMissionCard).join('') || empty('Нет активных миссий.')}</div></section><section class="panel span-6"><div class="panel-head"><div><h2>Следующий тик</h2><p>Продвигает время и автоматически уменьшает срок активных миссий.</p></div></div><div class="notice">Активные миссии потеряют 1 тик длительности. Когда у миссии останется 0 тиков, она получит статус «Готова к завершению», а ДМ сможет подтвердить итог одной кнопкой.</div><button class="good" onclick="closeTick()">Следующий тик</button></section><section class="panel span-6"><div class="panel-head"><div><h2>Быстрые действия</h2></div></div><div class="actions"><button onclick="openVisionForm()">Создать видение</button><button onclick="openChronicleForm()">Запись хроники</button><button onclick="exportState()">Экспорт JSON</button></div></section>${renderSharedArtLibrary()}</div>`;
    }

    function dmResourceForm() {
      return `<form onsubmit="saveDMResources(event)"><div class="form-grid"><div><label>Богатство</label><input name="wealth" type="number" min="1" max="100" value="${app.cult.wealth}" /></div><div><label>Благосклонность</label><input name="favor" type="number" min="0" max="20" value="${app.cult.favor}" /></div><div><label>Текущий тик</label><input name="currentTick" type="number" min="1" value="${app.cult.currentTick}" /></div><div><label>Дней в тике</label><input name="daysPerTick" type="number" min="1" value="${app.cult.daysPerTick}" /></div><div class="full"><label>Комментарий в хронику</label><textarea name="comment" placeholder="Например: добыча с рейда, потери, милость бога..."></textarea></div></div><div class="actions"><button type="submit">Сохранить ресурсы</button></div></form>`;
    }

    function saveDMResources(event) {
      event.preventDefault();
      const f = event.target;
      app.cult.wealth = clamp(Number(f.wealth.value), 1, 100);
      app.cult.favor = clamp(Number(f.favor.value), 0, 20);
      app.cult.currentTick = Number(f.currentTick.value);
      app.cult.daysPerTick = Number(f.daysPerTick.value);
      if (f.comment.value.trim()) app.chronicle.push({ id: uid('chron'), tick: app.cult.currentTick, title: 'Изменение ресурсов', type: 'Событие', text: f.comment.value.trim(), related: '', visibleToPlayer: true });
      saveState(false); render(); toast('Ресурсы обновлены.');
    }

    function closeTick() {
      if (!confirm('Перейти к следующему тику? Активные миссии продвинутся на 1 тик.')) return;
      app.missions.forEach(m => {
        if (!['Активна','Задержана','Осложнена'].includes(m.status)) return;
        m.remaining = Math.max(0, Number(m.remaining || 0) - 1);
        if (m.remaining === 0) {
          m.status = 'Готова к завершению';
          addReport(m, 'Срок миссии истёк. ДМ может подтвердить завершение, провал или добавить осложнение.');
        } else {
          addReport(m, `Прошёл тик. Осталось тиков: ${m.remaining}.`);
        }
      });
      app.chronicle.push({ id: uid('chron'), tick: app.cult.currentTick, title: `Тик ${app.cult.currentTick} завершён`, type: 'Событие', text: 'ДМ перевёл кампейн к следующему тику. Активные операции продвинулись по времени.', related: '', visibleToPlayer: true });
      app.cult.currentTick += 1;
      saveState(false); render(); toast('Начался следующий тик.');
    }

    function prefillMission(sourceType = '', sourceId = '', leaderId = '') {
      // This is a navigation-only action. It does not save state or create a mission.
      const leader = leaderId ? byId('leaders', leaderId) : null;
      if (leader && !sourceType) {
        sourceType = leader.type === 'Капитан флота' ? 'fleet' : 'location';
        sourceId = leader.assignmentId || '';
      }
      if (!sourceType && sourceId) {
        sourceType = byId('fleets', sourceId) ? 'fleet' : 'location';
      }
      currentTab = 'missions';
      render();
      const form = document.getElementById('newMissionForm');
      if (!form) return;
      const field = (name) => form.elements.namedItem(name);
      const sourceTypeField = field('sourceType');
      const sourceIdField = field('sourceId');
      const leaderIdField = field('leaderId');
      if (!sourceTypeField || !sourceIdField || !leaderIdField) return;

      if (sourceType === 'fleet' || sourceType === 'location') {
        sourceTypeField.value = sourceType;
        refreshMissionForm(form);
      } else {
        refreshMissionLeaders(form);
      }
      if (sourceId && Array.from(sourceIdField.options).some(option => option.value === sourceId)) {
        sourceIdField.value = sourceId;
        refreshMissionLeaders(form);
      }
      if (leader && Array.from(leaderIdField.options).some(option => option.value === leader.id)) {
        leaderIdField.value = leader.id;
        refreshMissionActionOptions(form);
        toast(`Исполнитель «${leader.name}» и место миссии выбраны.`);
      } else if (sourceIdField.value) {
        toast('Источник миссии выбран. Выбери свободного исполнителя.');
      } else {
        toast('Открыл форму новой миссии.');
      }
      form.scrollIntoView({block:'start', behavior:'smooth'});
      field('title')?.focus({preventScroll:true});
    }

    function deleteEntity(collection, id) {
      if (!confirm('Удалить запись?')) return;
      app[collection] = app[collection].filter(x => x.id !== id);
      if (collection === 'fleets') app.ships.forEach(s => { if (s.fleetId === id) s.fleetId = ''; });
      saveState(false); render();
    }

    function empty(text) { return `<div class="empty">${escapeHtml(text)}</div>`; }

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modal').showModal();
    }

    function closeModal() { pendingMapPosition=null; document.getElementById('modal').close(); }

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    async function bootstrap() {
      // Opening the downloaded HTML is a safe local preview; it cannot overwrite cloud data.
      if (location.protocol === 'file:') {
        const local = loadState();
        if (local?.cult) app=local;
        mode='player';
        normalizeState();
        syncStatus='Локальный просмотр';
        cloudSaveEnabled=false;
        render();
        return;
      }
      renderLoading();
      const loaded = await loadStateFromSupabase();
      cloudSaveEnabled = loaded;
      
    }

    window.addEventListener('beforeunload', () => {
      try {
        app.ui = { ...(app.ui || {}), mode, lastModifiedAt: app.ui?.lastModifiedAt || new Date().toISOString() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(app));
      } catch (error) {}
    });

    function renderLoading() {
      const main = document.getElementById('main');
      if (!main) return;
      main.innerHTML = '<div class="panel"><div class="empty">Загрузка судового журнала из Supabase...<br><br>Если Supabase не ответит за 30 секунд, приложение откроет локальную резервную копию.</div></div>';
    }

    bootstrap();
  </script>
</body>
</html>

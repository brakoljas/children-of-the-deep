      const l = id ? byId('leaders', id) : { name:'', type:'Капитан флота', assignmentId:'', skill:1, loyalty:3, status:'Свободен', currentMissionId:'', description:'', playerNotes:'', dmNotes:'' };
      const assignmentOpts = l.type === 'Капитан флота' ? entityOptions('fleets', l.assignmentId, null, 'Резерв') : entityOptions('locations', l.assignmentId, null, 'Без локации');
      openModal(id ? 'Редактировать главаря' : 'Добавить главаря', `<form onsubmit="saveLeader(event, '${id}')"><div class="form-grid"><div class="full"><label>Имя</label><input name="name" required value="${escapeHtml(l.name)}" /></div><div><label>Тип</label><select name="type" onchange="refreshLeaderAssignment(this.form)">${optionList(leaderTypes, l.type)}</select></div><div><label>Привязка</label><select name="assignmentId">${assignmentOpts}</select></div><div><label>Мастерство</label><input name="skill" type="number" min="1" max="5" value="${l.skill}" ${isDM() ? '' : 'readonly'} /></div><div><label>Лояльность</label><input name="loyalty" type="number" min="1" max="5" value="${l.loyalty}" ${isDM() ? '' : 'readonly'} /></div><div><label>Статус</label><select name="status" ${isDM() ? '' : 'disabled'}>${optionList(leaderStatuses, l.status)}</select></div><div class="full"><label>Описание</label><textarea name="description">${escapeHtml(l.description)}</textarea></div><div class="full"><label>Заметки игрока</label><textarea name="playerNotes">${escapeHtml(l.playerNotes)}</textarea></div>${isDM() ? `<div class="full"><label>Скрытые заметки ДМ</label><textarea name="dmNotes">${escapeHtml(l.dmNotes)}</textarea></div>` : ''}</div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
    }

    function refreshLeaderAssignment(form) {
      form.assignmentId.innerHTML = form.type.value === 'Капитан флота' ? entityOptions('fleets', '', null, 'Резерв') : entityOptions('locations', '', null, 'Без локации');
    }

    function saveLeader(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('leaders', id) : { id: uid('leader'), currentMissionId: '' };
      obj.name = f.name.value;
      obj.type = f.type.value;
      obj.assignmentId = f.assignmentId.value;
      obj.description = f.description.value;
      obj.playerNotes = f.playerNotes.value;
      if (isDM()) { obj.skill = Number(f.skill.value); obj.loyalty = Number(f.loyalty.value); obj.status = f.status.value; obj.dmNotes = f.dmNotes?.value || ''; } else { obj.skill = obj.skill || 1; obj.loyalty = obj.loyalty || 3; obj.status = obj.status || 'Свободен'; }
      if (!id) app.leaders.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderVisions() {
      return `<div class="grid"><section class="panel span-8"><div class="panel-head"><div><h2>Видения Хидр'Када</h2><p>Сны, знамения, приказы и угрозы Подводного бога.</p></div>${isDM() ? `<button onclick="openVisionForm()">Создать видение</button>` : ''}</div><div class="list">${app.visions.length ? app.visions.map(renderVisionCard).join('') : empty('Хидр\'Кад пока молчит.')}</div></section><section class="panel span-4"><div class="panel-head"><div><h2>Заметка</h2></div></div><div class="notice">Видения нужны, чтобы культ не превращался в бухгалтерию. Через них ДМ может задавать мистические цели, цену силы и давление бога.</div></section></div>`;
    }

    function renderVisionCard(v) {
      return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(v.title)}</div><div class="item-sub">${escapeHtml(v.type)} • Тик ${v.tick}</div></div>${statusChip(v.status)}</div><p class="item-sub">${escapeHtml(v.text)}</p>${v.reward ? `<p class="item-sub"><strong>Награда / последствия:</strong> ${escapeHtml(v.reward)}</p>` : ''}${isDM() && v.dmNotes ? `<p class="item-sub"><strong>Скрытый смысл:</strong> ${escapeHtml(v.dmNotes)}</p>` : ''}<div class="actions"><button class="small ghost" onclick="openVisionForm('${v.id}')">Редактировать</button>${isDM() ? `<button class="small danger" onclick="deleteEntity('visions','${v.id}')">Удалить</button>` : ''}</div></div>`;
    }

    function renderVisionMini(v) { return `<div class="item"><div class="item-title">${escapeHtml(v.title)}</div><div class="item-sub">${escapeHtml(v.type)} • ${escapeHtml(v.status)}</div></div>`; }

    function openVisionForm(id = '') {
      if (!isDM() && !id) return;
      const v = id ? byId('visions', id) : { title:'', type:'Видение', tick:app.cult.currentTick, text:'', status:'Активно', missionId:'', reward:'', playerNotes:'', dmNotes:'' };
      openModal(id ? 'Редактировать видение' : 'Создать видение', `<form onsubmit="saveVision(event, '${id}')"><div class="form-grid"><div class="full"><label>Название</label><input name="title" required value="${escapeHtml(v.title)}" ${isDM() ? '' : 'readonly'} /></div><div><label>Тип</label><select name="type" ${isDM() ? '' : 'disabled'}>${optionList(visionTypes, v.type)}</select></div><div><label>Статус</label><select name="status" ${isDM() ? '' : 'disabled'}>${optionList(visionStatuses, v.status)}</select></div><div><label>Тик</label><input name="tick" type="number" value="${v.tick}" ${isDM() ? '' : 'readonly'} /></div><div><label>Связанная миссия</label><select name="missionId" ${isDM() ? '' : 'disabled'}>${entityOptions('missions', v.missionId, null, 'Без миссии')}</select></div><div class="full"><label>Текст</label><textarea name="text" ${isDM() ? '' : 'readonly'}>${escapeHtml(v.text)}</textarea></div><div class="full"><label>Награда / последствия</label><textarea name="reward" ${isDM() ? '' : 'readonly'}>${escapeHtml(v.reward)}</textarea></div><div class="full"><label>Заметки игрока</label><textarea name="playerNotes">${escapeHtml(v.playerNotes)}</textarea></div>${isDM() ? `<div class="full"><label>Скрытые заметки ДМ</label><textarea name="dmNotes">${escapeHtml(v.dmNotes)}</textarea></div>` : ''}</div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
    }

    function saveVision(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('visions', id) : { id: uid('vision') };
      if (isDM()) { obj.title = f.title.value; obj.type = f.type.value; obj.status = f.status.value; obj.tick = Number(f.tick.value); obj.missionId = f.missionId.value; obj.text = f.text.value; obj.reward = f.reward.value; obj.dmNotes = f.dmNotes?.value || ''; }
      obj.playerNotes = f.playerNotes.value;
      if (!id) app.visions.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderChronicle() {
      const visible = app.chronicle.filter(c => isDM() || c.visibleToPlayer);
      const ticks = [...new Set(visible.map(c => c.tick))].sort((a,b) => b-a);
      return `<div class="panel"><div class="panel-head"><div><h2>Хроника</h2><p>История развития культа по тикам.</p></div>${isDM() ? `<button onclick="openChronicleForm()">Создать запись</button>` : ''}</div>${ticks.map(t => `<h3>Тик ${t}</h3><div class="list" style="margin-bottom:16px;">${visible.filter(c => c.tick === t).map(renderChronicleCard).join('')}</div>`).join('') || empty('Хроника пока пуста.')}</div>`;
    }

    function renderChronicleCard(c) {
      return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(c.title)}</div><div class="item-sub">${escapeHtml(c.type)} • Тик ${c.tick}</div></div>${isDM() ? `<span class="chip ${c.visibleToPlayer ? 'good' : 'warn'}">${c.visibleToPlayer ? 'Видно игроку' : 'Скрыто'}</span>` : ''}</div><p class="item-sub">${escapeHtml(c.text)}</p><div class="actions">${isDM() ? `<button class="small ghost" onclick="openChronicleForm('${c.id}')">Редактировать</button><button class="small danger" onclick="deleteEntity('chronicle','${c.id}')">Удалить</button>` : ''}</div></div>`;
    }

    function openChronicleForm(id = '') {
      if (!isDM()) return;
      const c = id ? byId('chronicle', id) : { tick: app.cult.currentTick, title:'', type:'Событие', text:'', related:'', visibleToPlayer:true };
      openModal(id ? 'Редактировать хронику' : 'Создать запись хроники', `<form onsubmit="saveChronicle(event, '${id}')"><div class="form-grid"><div><label>Тик</label><input name="tick" type="number" value="${c.tick}" /></div><div><label>Тип</label><select name="type">${optionList(chronicleTypes, c.type)}</select></div><div class="full"><label>Заголовок</label><input name="title" required value="${escapeHtml(c.title)}" /></div><div class="full"><label>Текст</label><textarea name="text">${escapeHtml(c.text)}</textarea></div><div><label>Видно игроку</label><select name="visibleToPlayer"><option value="true" ${c.visibleToPlayer ? 'selected' : ''}>Да</option><option value="false" ${!c.visibleToPlayer ? 'selected' : ''}>Нет</option></select></div></div><div class="modal-actions"><button type="submit">Сохранить</button></div></form>`);
    }

    function saveChronicle(event, id) {
      event.preventDefault();
      const f = event.target;
      const obj = id ? byId('chronicle', id) : { id: uid('chron') };
      obj.tick = Number(f.tick.value);
      obj.type = f.type.value;
      obj.title = f.title.value;
      obj.text = f.text.value;
      obj.visibleToPlayer = f.visibleToPlayer.value === 'true';
      if (!id) app.chronicle.push(obj);
      saveState(false); closeModal(); render();
    }

    function renderDM() {
      return `<div class="grid"><section class="panel span-4"><div class="panel-head"><div><h2>Ресурсы</h2><p>Быстрая правка чисел.</p></div></div>${dmResourceForm()}</section><section class="panel span-8"><div class="panel-head"><div><h2>Очередь ДМ</h2><p>Приказы на подтверждение и активные миссии.</p></div></div><h3>Ожидают подтверждения</h3><div class="list">${pendingMissions().map(renderMissionCard).join('') || empty('Нет миссий на подтверждение.')}</div><h3 style="margin-top:16px;">Активные</h3><div class="list">${activeMissions().map(renderMissionCard).join('') || empty('Нет активных миссий.')}</div></section><section class="panel span-6"><div class="panel-head"><div><h2>Следующий тик</h2><p>Продвигает время и автоматически уменьшает срок активных миссий.</p></div></div><div class="notice">Активные миссии потеряют 1 тик длительности. Когда у миссии останется 0 тиков, она получит статус «Готова к завершению», а ДМ сможет подтвердить итог одной кнопкой.</div><button class="good" onclick="closeTick()">Следующий тик</button></section><section class="panel span-6"><div class="panel-head"><div><h2>Быстрые действия</h2></div></div><div class="actions"><button onclick="openVisionForm()">Создать видение</button><button onclick="openChronicleForm()">Запись хроники</button><button onclick="exportState()">Экспорт JSON</button></div></section></div>`;
    }

    function dmResourceForm() {
      return `<form onsubmit="saveDMResources(event)"><div class="form-grid"><div><label>Богатство</label><input name="wealth" type="number" min="1" max="100" value="${app.cult.wealth}" /></div><div><label>Благосклонность</label><input name="favor" type="number" min="0" max="20" value="${app.cult.favor}" /></div><div><label>Текущий тик</label><input name="currentTick" type="number" min="1" value="${app.cult.currentTick}" /></div><div><label>Дней в тике</label><input name="daysPerTick" type="number" min="1" value="${app.cult.daysPerTick}" /></div><div class="full"><label>Комментарий в хронику</label><textarea name="comment" placeholder="Например: добыча с рейда, потери, милость бога..."></textarea></div></div><div class="actions"><button type="submit">Сохранить ресурсы</button></div></form>`;
    }

    function saveDMResources(event) {
      event.preventDefault();
      const f = event.target;
      app.cult.wealth = clamp(Number(f.wealth.value), 1, 100);
      app.cult.favor = clamp(Number(f.favor.value), 0, 20);
      app.cult.currentTick = Number(f.currentTick.value);
      app.cult.daysPerTick = Number(f.daysPerTick.value);
      if (f.comment.value.trim()) app.chronicle.push({ id: uid('chron'), tick: app.cult.currentTick, title: 'Изменение ресурсов', type: 'Событие', text: f.comment.value.trim(), related: '', visibleToPlayer: true });
      saveState(false); render(); toast('Ресурсы обновлены.');
    }

    function closeTick() {
      if (!confirm('Перейти к следующему тику? Активные миссии продвинутся на 1 тик.')) return;
      app.missions.forEach(m => {
        if (!['Активна','Задержана','Осложнена'].includes(m.status)) return;
        m.remaining = Math.max(0, Number(m.remaining || 0) - 1);
        if (m.remaining === 0) {
          m.status = 'Готова к завершению';
          addReport(m, 'Срок миссии истёк. ДМ может подтвердить завершение, провал или добавить осложнение.');
        } else {
          addReport(m, `Прошёл тик. Осталось тиков: ${m.remaining}.`);
        }
      });
      app.chronicle.push({ id: uid('chron'), tick: app.cult.currentTick, title: `Тик ${app.cult.currentTick} завершён`, type: 'Событие', text: 'ДМ перевёл кампейн к следующему тику. Активные операции продвинулись по времени.', related: '', visibleToPlayer: true });
      app.cult.currentTick += 1;
      saveState(false); render(); toast('Начался следующий тик.');
    }

    function prefillMission(sourceType = '', sourceId = '', leaderId = '') {
      currentTab = 'missions';
      render();
      toast('Открыл вкладку миссий. Заполни приказ вручную.');
    }

    function deleteEntity(collection, id) {
      if (!confirm('Удалить запись?')) return;
      app[collection] = app[collection].filter(x => x.id !== id);
      if (collection === 'fleets') app.ships.forEach(s => { if (s.fleetId === id) s.fleetId = ''; });
      saveState(false); render();
    }

    function empty(text) { return `<div class="empty">${escapeHtml(text)}</div>`; }

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modal').showModal();
    }

    function closeModal() { document.getElementById('modal').close(); }

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    normalizeState();
    render();
  </script>
</body>
</html>
